<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Income Expense Tracker</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts (Inter for Eng, Padauk for MM) -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Padauk:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .mm-font {
            font-family: 'Padauk', sans-serif;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- Translations ---
        const TRANSLATIONS = {
            en: {
                title: "Expense Tracker",
                loginTitle: "Welcome Back",
                username: "Username",
                password: "Password",
                loginBtn: "Login",
                errorMsg: "Invalid credentials",
                balance: "Your Balance",
                income: "Income",
                expense: "Expense",
                history: "Transaction History",
                newTrans: "Add New Transaction",
                textPlaceholder: "Description (e.g., Month Salary)",
                amountPlaceholder: "Amount",
                addBtn: "Add Transaction",
                export: "Export CSV",
                logout: "Logout",
                noTrans: "No transactions yet.",
                delete: "Delete",
                typeInc: "Income",
                typeExp: "Expense",
                category: "Category",
                selectCat: "Select Category",
                customCat: "Enter custom category",
                addCat: "Add",
                catLabel: "Category",
                addCustom: "+ Add New"
            },
            mm: {
                title: "ဝင်ငွေ/ထွက်ငွေ စာရင်း",
                loginTitle: "အကောင့်ဝင်ရန်",
                username: "အသုံးပြုသူအမည်",
                password: "စကားဝှက်",
                loginBtn: "အကောင့်ဝင်မည်",
                errorMsg: "အချက်အလက် မှားယွင်းနေပါသည်",
                balance: "လက်ကျန်ငွေ",
                income: "ဝင်ငွေ",
                expense: "ထွက်ငွေ",
                history: "ငွေစာရင်းမှတ်တမ်း",
                newTrans: "စာရင်းအသစ်ထည့်ရန်",
                textPlaceholder: "အကြောင်းအရာ (ဥပမာ - ဒီလစာ)",
                amountPlaceholder: "ပမာဏ",
                addBtn: "စာရင်းသွင်းမည်",
                export: "CSV ထုတ်ယူရန်",
                logout: "ထွက်မည်",
                noTrans: "မှတ်တမ်း မရှိသေးပါ။",
                delete: "ဖျက်မည်",
                typeInc: "ဝင်ငွေ",
                typeExp: "ထွက်ငွေ",
                category: "ကဏ္ဍ",
                selectCat: "ကဏ္ဍ ရွေးချယ်ပါ",
                customCat: "ကဏ္ဍအသစ် ရိုက်ထည့်ပါ",
                addCat: "ထည့်မည်",
                catLabel: "အမျိုးအစား",
                addCustom: "+ အသစ်ထည့်မည်"
            }
        };

        // --- Components ---

        // 1. Login Component
        const Login = ({ onLogin, lang, setLang, error }) => {
            const [user, setUser] = useState('');
            const [pass, setPass] = useState('');
            const t = TRANSLATIONS[lang];

            const handleSubmit = (e) => {
                e.preventDefault();
                onLogin(user, pass);
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-500 to-indigo-700 px-4">
                    <div className="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md transform transition-all hover:scale-[1.01]">
                        <div className="flex justify-end mb-4">
                            <button
                                onClick={() => setLang(lang === 'en' ? 'mm' : 'en')}
                                className="text-xs font-bold px-3 py-1 bg-gray-100 hover:bg-gray-200 rounded-full text-gray-600 transition"
                            >
                                {lang === 'en' ? 'မြန်မာ' : 'English'}
                            </button>
                        </div>
                        <h2 className={`text-3xl font-bold text-center text-gray-800 mb-8 ${lang === 'mm' ? 'mm-font' : ''}`}>
                            {t.loginTitle}
                        </h2>
                        <form onSubmit={handleSubmit} className="space-y-6">
                            <div>
                                <label className={`block text-sm font-medium text-gray-700 mb-1 ${lang === 'mm' ? 'mm-font' : ''}`}>{t.username}</label>
                                <input
                                    type="text"
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                                    value={user}
                                    onChange={(e) => setUser(e.target.value)}
                                    placeholder="admin"
                                />
                            </div>
                            <div>
                                <label className={`block text-sm font-medium text-gray-700 mb-1 ${lang === 'mm' ? 'mm-font' : ''}`}>{t.password}</label>
                                <input
                                    type="password"
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
                                    value={pass}
                                    onChange={(e) => setPass(e.target.value)}
                                    placeholder="admin123"
                                />
                            </div>
                            {error && <p className={`text-red-500 text-sm text-center ${lang === 'mm' ? 'mm-font' : ''}`}>{t.errorMsg}</p>}
                            <button
                                type="submit"
                                className={`w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-300 shadow-md ${lang === 'mm' ? 'mm-font' : ''}`}
                            >
                                {t.loginBtn}
                            </button>
                        </form>
                        <div className="mt-6 text-center text-xs text-gray-400">
                            Demo: admin / admin123
                        </div>
                    </div>
                </div>
            );
        };

        // 2. Chart Component
        const ChartComponent = ({ income, expense, lang }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);
            const t = TRANSLATIONS[lang];

            useEffect(() => {
                if (chartInstance.current) {
                    chartInstance.current.destroy();
                }

                const ctx = chartRef.current.getContext('2d');

                // Prevent chart from rendering if no data
                if (income === 0 && expense === 0) {
                    // Let canvas remain empty or handle gracefully
                }

                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: [t.income, t.expense],
                        datasets: [{
                            data: [income, expense],
                            backgroundColor: ['#10B981', '#EF4444'],
                            borderWidth: 0,
                            hoverOffset: 4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        cutout: '70%',
                        plugins: {
                            legend: {
                                position: 'bottom',
                                labels: {
                                    font: {
                                        family: lang === 'mm' ? 'Padauk' : 'Inter'
                                    }
                                }
                            }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [income, expense, lang]);

            return (
                <div className="h-64 w-full relative">
                    {(income === 0 && expense === 0) ? (
                        <div className="absolute inset-0 flex items-center justify-center text-gray-400 text-sm">
                            No data to display
                        </div>
                    ) : null}
                    <canvas ref={chartRef} />
                </div>
            );
        };

        // 3. Main App Component
        const App = () => {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [loginError, setLoginError] = useState(false);
            const [lang, setLang] = useState('en');

            // Load transactions from localStorage on init
            const [transactions, setTransactions] = useState(() => {
                const saved = localStorage.getItem('tracker_transactions');
                return saved ? JSON.parse(saved) : [];
            });

            // Load categories from localStorage or default
            const [categories, setCategories] = useState(() => {
                const saved = localStorage.getItem('tracker_categories');
                return saved ? JSON.parse(saved) : {
                    income: ['Salary', 'Business', 'Investment', 'Gift', 'Other'],
                    expense: ['Food', 'Transport', 'Housing', 'Utilities', 'Entertainment', 'Health', 'Shopping', 'Other']
                };
            });

            const [text, setText] = useState('');
            const [amount, setAmount] = useState('');
            const [type, setType] = useState('expense'); // 'income' or 'expense'
            const [selectedCat, setSelectedCat] = useState('');
            const [isCustomCat, setIsCustomCat] = useState(false);
            const [customCatInput, setCustomCatInput] = useState('');

            // Save data whenever it changes
            useEffect(() => {
                localStorage.setItem('tracker_transactions', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                localStorage.setItem('tracker_categories', JSON.stringify(categories));
            }, [categories]);

            // Icon rendering (lucide)
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const t = TRANSLATIONS[lang];

            // Derived State
            const amounts = transactions.map(transaction => transaction.amount);
            const total = amounts.reduce((acc, item) => (acc += item), 0).toFixed(2);
            const income = amounts
                .filter(item => item > 0)
                .reduce((acc, item) => (acc += item), 0)
                .toFixed(2);
            const expense = (
                amounts.filter(item => item < 0).reduce((acc, item) => (acc += item), 0) * -1
            ).toFixed(2);

            // Handlers
            const handleLogin = (u, p) => {
                if (u === 'admin' && p === 'admin123') {
                    setIsLoggedIn(true);
                    setLoginError(false);
                } else {
                    setLoginError(true);
                }
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                // Login component resets itself on remount, no need to clear user/pass here
            };

            const addTransaction = (e) => {
                e.preventDefault();
                if (!text || !amount) return;

                // Determine final category
                let finalCat = selectedCat;
                if (isCustomCat && customCatInput) {
                    finalCat = customCatInput;
                    // Add to list if not exists
                    if (!categories[type].includes(finalCat)) {
                        const newCats = { ...categories };
                        newCats[type].push(finalCat);
                        setCategories(newCats);
                    }
                } else if (!finalCat) {
                    finalCat = 'Other';
                }

                const val = parseFloat(amount);
                const finalAmount = type === 'expense' ? -Math.abs(val) : Math.abs(val);

                const newTransaction = {
                    id: Math.floor(Math.random() * 100000000),
                    text,
                    amount: finalAmount,
                    category: finalCat,
                    type,
                    date: new Date().toLocaleDateString()
                };

                setTransactions([newTransaction, ...transactions]);
                setText('');
                setAmount('');
                setSelectedCat('');
                setIsCustomCat(false);
                setCustomCatInput('');
            };

            const deleteTransaction = (id) => {
                setTransactions(transactions.filter(transaction => transaction.id !== id));
            };

            const exportCSV = () => {
                if (transactions.length === 0) return;

                const headers = ["ID", "Description", "Category", "Amount", "Type", "Date"];
                const rows = transactions.map(tx => [
                    tx.id,
                    `"${tx.text}"`,
                    `"${tx.category || 'General'}"`,
                    tx.amount,
                    tx.amount > 0 ? "Income" : "Expense",
                    tx.date
                ]);

                const csvContent = "data:text/csv;charset=utf-8,"
                    + headers.join(",") + "\n"
                    + rows.map(e => e.join(",")).join("\n");

                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", "transactions.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            if (!isLoggedIn) {
                return <Login onLogin={handleLogin} lang={lang} setLang={setLang} error={loginError} />;
            }

            return (
                <div className={`min-h-screen bg-gray-50 transition-colors duration-500 ${lang === 'mm' ? 'mm-font' : ''}`}>

                    {/* Navbar */}
                    <nav className="bg-indigo-600 text-white shadow-lg">
                        <div className="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <i data-lucide="wallet" className="w-6 h-6"></i>
                                <h1 className="text-xl font-bold">{t.title}</h1>
                            </div>
                            <div className="flex items-center gap-3">
                                <button
                                    onClick={() => setLang(lang === 'en' ? 'mm' : 'en')}
                                    className="px-3 py-1 bg-indigo-500 hover:bg-indigo-400 rounded text-sm font-medium transition"
                                >
                                    {lang === 'en' ? 'မြန်မာ' : 'English'}
                                </button>
                                <button
                                    onClick={handleLogout}
                                    className="flex items-center gap-1 text-sm opacity-80 hover:opacity-100 hover:underline"
                                >
                                    {t.logout}
                                    <i data-lucide="log-out" className="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    </nav>

                    <div className="max-w-5xl mx-auto px-4 py-8 grid grid-cols-1 md:grid-cols-3 gap-8">

                        {/* Left Column: Stats & Form */}
                        <div className="md:col-span-2 space-y-6">

                            {/* Summary Cards */}
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div className="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-500">
                                    <h4 className="text-gray-500 text-xs uppercase font-bold">{t.balance}</h4>
                                    <p className="text-2xl font-bold text-gray-800 mt-1">${total}</p>
                                </div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border-l-4 border-green-500">
                                    <h4 className="text-gray-500 text-xs uppercase font-bold">{t.income}</h4>
                                    <p className="text-2xl font-bold text-green-600 mt-1">+${income}</p>
                                </div>
                                <div className="bg-white p-5 rounded-xl shadow-sm border-l-4 border-red-500">
                                    <h4 className="text-gray-500 text-xs uppercase font-bold">{t.expense}</h4>
                                    <p className="text-2xl font-bold text-red-600 mt-1">-${expense}</p>
                                </div>
                            </div>

                            {/* Charts Area */}
                            <div className="bg-white p-6 rounded-xl shadow-sm">
                                <h3 className="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">Overview</h3>
                                <div className="flex justify-center">
                                    <div className="w-64">
                                        <ChartComponent income={parseFloat(income)} expense={parseFloat(expense)} lang={lang} />
                                    </div>
                                </div>
                            </div>

                            {/* Transaction List */}
                            <div className="bg-white p-6 rounded-xl shadow-sm">
                                <div className="flex justify-between items-center mb-4 border-b pb-2">
                                    <h3 className="text-lg font-semibold text-gray-700">{t.history}</h3>
                                    <button
                                        onClick={exportCSV}
                                        disabled={transactions.length === 0}
                                        className="flex items-center gap-1 text-sm text-blue-600 hover:text-blue-800 disabled:opacity-50 disabled:cursor-not-allowed"
                                    >
                                        <i data-lucide="download" className="w-4 h-4"></i>
                                        {t.export}
                                    </button>
                                </div>

                                <div className="max-h-96 overflow-y-auto space-y-3 pr-1">
                                    {transactions.length === 0 && <p className="text-center text-gray-400 py-4">{t.noTrans}</p>}

                                    {transactions.map(transaction => (
                                        <div key={transaction.id} className="group bg-gray-50 hover:bg-gray-100 p-3 rounded-lg flex justify-between items-center transition border-r-4 border-transparent hover:shadow-md relative"
                                            style={{ borderColor: transaction.amount < 0 ? '#EF4444' : '#10B981' }}
                                        >
                                            <div>
                                                <p className="font-bold text-gray-800">{transaction.category || 'General'}</p>
                                                <p className="text-sm text-gray-600">{transaction.text}</p>
                                                <p className="text-xs text-gray-400">{transaction.date}</p>
                                            </div>
                                            <div className="flex items-center gap-4">
                                                <span className={`font-bold ${transaction.amount < 0 ? 'text-red-600' : 'text-green-600'}`}>
                                                    {transaction.amount < 0 ? '-' : '+'}${Math.abs(transaction.amount)}
                                                </span>
                                                <button
                                                    onClick={() => deleteTransaction(transaction.id)}
                                                    className="text-gray-400 hover:text-red-500 opacity-0 group-hover:opacity-100 transition"
                                                    title={t.delete}
                                                >
                                                    <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>

                        {/* Right Column: Add New */}
                        <div className="md:col-span-1">
                            <div className="bg-white p-6 rounded-xl shadow-lg sticky top-6">
                                <h3 className="text-lg font-semibold text-gray-700 mb-4 border-b pb-2">{t.newTrans}</h3>
                                <form onSubmit={addTransaction} className="space-y-4">

                                    {/* Type Toggle */}
                                    <div className="flex bg-gray-100 p-1 rounded-lg">
                                        <button
                                            type="button"
                                            onClick={() => { setType('income'); setIsCustomCat(false); setSelectedCat(''); }}
                                            className={`flex-1 py-2 rounded-md text-sm font-medium transition ${type === 'income' ? 'bg-white text-green-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                        >
                                            {t.typeInc}
                                        </button>
                                        <button
                                            type="button"
                                            onClick={() => { setType('expense'); setIsCustomCat(false); setSelectedCat(''); }}
                                            className={`flex-1 py-2 rounded-md text-sm font-medium transition ${type === 'expense' ? 'bg-white text-red-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}
                                        >
                                            {t.typeExp}
                                        </button>
                                    </div>

                                    {/* Category Select */}
                                    <div>
                                        <label className="block text-sm font-medium text-gray-600 mb-1">{t.catLabel}</label>
                                        {!isCustomCat ? (
                                            <select
                                                value={selectedCat}
                                                onChange={(e) => {
                                                    if (e.target.value === 'CUSTOM') {
                                                        setIsCustomCat(true);
                                                    } else {
                                                        setSelectedCat(e.target.value);
                                                    }
                                                }}
                                                className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white"
                                            >
                                                <option value="">{t.selectCat}</option>
                                                {categories[type].map(cat => (
                                                    <option key={cat} value={cat}>{cat}</option>
                                                ))}
                                                <option value="CUSTOM" className="font-bold text-indigo-600">{t.addCustom}</option>
                                            </select>
                                        ) : (
                                            <div className="flex gap-2">
                                                <input
                                                    type="text"
                                                    value={customCatInput}
                                                    onChange={(e) => setCustomCatInput(e.target.value)}
                                                    className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                                                    placeholder={t.customCat}
                                                    autoFocus
                                                />
                                                <button
                                                    type="button"
                                                    onClick={() => setIsCustomCat(false)}
                                                    className="px-3 py-2 text-gray-500 hover:bg-gray-100 rounded-lg"
                                                >
                                                    ✕
                                                </button>
                                            </div>
                                        )}
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-600 mb-1">{t.textPlaceholder}</label>
                                        <input
                                            type="text"
                                            value={text}
                                            onChange={(e) => setText(e.target.value)}
                                            className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                                            placeholder="..."
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-sm font-medium text-gray-600 mb-1">{t.amountPlaceholder}</label>
                                        <div className="relative">
                                            <span className="absolute left-3 top-2 text-gray-400">$</span>
                                            <input
                                                type="number"
                                                value={amount}
                                                onChange={(e) => setAmount(e.target.value)}
                                                className="w-full pl-7 pr-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"
                                                placeholder="0.00"
                                                min="0"
                                                step="0.01"
                                            />
                                        </div>
                                    </div>
                                    <button
                                        type="submit"
                                        className={`w-full text-white py-2 rounded-lg font-semibold transition shadow-md flex justify-center items-center gap-2 ${type === 'income' ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}
                                    >
                                        <i data-lucide="plus-circle" className="w-4 h-4"></i>
                                        {t.addBtn}
                                    </button>
                                </form>
                            </div>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
